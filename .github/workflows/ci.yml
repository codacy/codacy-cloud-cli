name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API client
        run: npm run update-api

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Smoke test the built CLI
        run: |
          # Nothing in the test suite executes the entry point -- every command test
          # builds a bare `new Command()` -- so this step is the only coverage of
          # src/index.ts's top-level block, on every Node version we support.
          node dist/index.js --version

          # With proxy env set, the undici dispatcher is actually constructed (the
          # run above returns early, since no proxy variable is set). `--version`
          # makes no request, so the unreachable proxy is never dialed. This guards
          # against a proxy dependency that fails to load or construct on Node 20.
          HTTPS_PROXY=http://127.0.0.1:9 node dist/index.js --version

          # A misconfigured CA bundle must fail loudly rather than silently fall
          # back to the system trust store.
          if out=$(SSL_CERT_FILE=/nonexistent/ca.pem node dist/index.js --version 2>&1); then
            echo "::error::Expected a non-zero exit for an unreadable SSL_CERT_FILE"
            exit 1
          fi
          case "$out" in
            *"Failed to read CA certificate"*) ;;
            *) echo "::error::Unexpected failure output: $out"; exit 1 ;;
          esac

      - name: Test
        run: npm test

  changeset-check:
    # Skip the changesets bot's "version packages" PR: it consumes (deletes)
    # changesets rather than adding them, so it would always fail this check.
    # The bot branches as changeset-release/<baseBranch>, so match the prefix.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check for changesets
        run: |
          # Count .changeset/*.md files added/modified in this PR compared to the base branch
          CHANGESETS=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- '.changeset/*.md' ':!.changeset/README.md' | wc -l)
          if [ "$CHANGESETS" -eq 0 ]; then
            echo "::error::No changeset found for this PR. Run 'npx changeset' to describe your changes."
            echo ""
            echo "If this PR does not require a version bump (e.g., docs-only or CI changes),"
            echo "add an empty changeset with: npx changeset --empty"
            exit 1
          fi
          echo "Found $CHANGESETS changeset file(s) changed in this PR."
